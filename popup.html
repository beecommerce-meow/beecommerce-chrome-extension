<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BeeCommerce Importer</title>
    <style>
      :root{
        --bg:#0b1020;
        --card: rgba(255,255,255,.06);
        --card2: rgba(255,255,255,.04);
        --border: rgba(255,255,255,.10);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.68);
        --brand:#facc15;
        --brandText:#111827;
        --danger:#ff5a5f;
        --ok:#3ddc97;
        --shadow: 0 14px 34px rgba(0,0,0,.45);
      }
      *{box-sizing:border-box}
      body{
        margin:0;
        width:360px;
        padding:14px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        background:
          radial-gradient(800px 260px at 15% -10%, rgba(250,204,21,.25), transparent 60%),
          radial-gradient(700px 260px at 120% 0%, rgba(59,130,246,.18), transparent 55%),
          var(--bg);
        color:var(--text);
      }

      .header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:12px;
      }
      .brand{
        display:flex; align-items:center; gap:10px;
      }
      .logo{
        width:38px; height:38px;
        border-radius:12px;
        background: linear-gradient(135deg, #facc15, #fbbf24);
        box-shadow: 0 10px 18px rgba(250,204,21,.18);
        display:grid; place-items:center;
        color:#111827;
        font-weight:900;
      }
      .title{
        line-height:1.1;
      }
      .title h3{
        margin:0;
        font-size:14px;
        letter-spacing:.2px;
      }
      .title .sub{
        margin-top:3px;
        font-size:12px;
        color:var(--muted);
      }

      .card{
        background: linear-gradient(180deg, var(--card), var(--card2));
        border:1px solid var(--border);
        border-radius:18px;
        padding:12px;
        box-shadow: var(--shadow);
      }

      .section{
        font-size:12px;
        color:var(--muted);
        margin:6px 0 10px;
      }

      .field{
        display:grid;
        gap:7px;
        margin-bottom:10px;
      }
      label{
        font-size:12px;
        color:var(--muted);
      }
      input{
        width:100%;
        padding:11px 12px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.12);
        background: rgba(0,0,0,.22);
        color:var(--text);
        outline:none;
      }
      input:focus{
        border-color: rgba(250,204,21,.55);
        box-shadow: 0 0 0 3px rgba(250,204,21,.18);
      }

      .btn{
        width:100%;
        padding:11px 12px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        font-weight:800;
        transition: transform .04s ease, opacity .15s ease;
      }
      .btn:active{ transform: translateY(1px); }
      .btn:disabled{ opacity:.55; cursor:not-allowed; }

      .btnPrimary{
        background: var(--brand);
        color: var(--brandText);
        box-shadow: 0 12px 22px rgba(250,204,21,.16);
      }
      .btnGhost{
        background: rgba(255,255,255,.08);
        color: var(--text);
        border: 1px solid rgba(255,255,255,.12);
      }

      .row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin-top:10px;
      }

      .pill{
        display:flex;
        align-items:center;
        gap:8px;
        padding:8px 10px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.06);
        font-size:12px;
        color:var(--muted);
      }
      .dot{
        width:8px; height:8px;
        border-radius:999px;
        background: rgba(255,255,255,.35);
      }
      .dot.ok{ background: var(--ok); }
      .dot.bad{ background: var(--danger); }

      #status{
        margin-top:10px;
        padding:10px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.12);
        background: rgba(0,0,0,.22);
        font-size:12px;
        white-space: pre-wrap;
      }
      #status.ok{ border-color: rgba(61,220,151,.35); }
      #status.err{ border-color: rgba(255,90,95,.35); }

      .hint{
        margin-top:10px;
        font-size:11px;
        line-height:1.4;
        color: rgba(255,255,255,.55);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <div class="logo">🐝</div>
        <div class="title">
          <h3>BeeCommerce Importer</h3>
          <div class="sub">Scrape → Draft → Shopify</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="loggedOut">
        <div class="section">Sign in (Firebase email/password)</div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="you@email.com" />
        </div>

        <div class="field">
          <label>Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>

        <button id="loginBtn" class="btn btnPrimary">Sign In</button>
        <div class="hint">Tip: Sign in once, then you can import faster.</div>
      </div>

      <div id="loggedIn" style="display:none;">
        <div class="section">Session</div>

        <div class="pill">
          <span class="dot ok"></span>
          <span>Signed in as <span id="userEmail"></span></span>
        </div>

        <button id="importBtn" class="btn btnPrimary" style="margin-top:10px;">
          Import current page
        </button>

        <div class="row">
          <button id="openDraftBtn" class="btn btnGhost" disabled>Open Draft</button>
          <button id="logoutBtn" class="btn btnGhost">Sign Out</button>
        </div>

        <div class="hint">After import, “Open Draft” will activate.</div>
      </div>

      <div id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
